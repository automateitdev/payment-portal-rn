name: Deploy Production Web

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Expo Web
        # INJECT ENV HERE: This bakes the API URL into your JS files
        env:
          EXPO_PUBLIC_API_URL: https://api.eims.live/api
        run: npx expo export --platform web

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      # Keep going if one site fails so the other still gets the build
      fail-fast: false
      matrix:
        # Add another domain here to deploy the same bundle to one more site
        domain:
          - pay.edumateims.com
          - rupalipay.edumateims.com

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Pre-Deploy Clean (Wipe Source Folders)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Remove everything including old source folders like (app), (auth)
            # and the Hestia placeholder index.php
            rm -rf /home/produser/web/${{ matrix.domain }}/public_html/*

      - name: Deploy to Production Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/home/produser/web/${{ matrix.domain }}/public_html/"
          strip_components: 1
          overwrite: true

      - name: Finalize Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Set ownership to the Hestia user
            chown -R produser:produser /home/produser/web/${{ matrix.domain }}/public_html
            chmod -R 755 /home/produser/web/${{ matrix.domain }}/public_html
